{% extends 'shop/base.html' %}
{% block title %}Password Reset Complete - {{ STORE_NAME|default:'Bdcrafter.com' }}{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto rounded-3xl bg-white p-10 shadow-sm text-center">
    <h1 class="text-3xl font-semibold">Password reset complete</h1>
    <p class="mt-4 text-slate-500">Your password has been set. You may go ahead and log in now.</p>
    <a href="{% url 'login' %}" class="mt-6 inline-flex rounded-2xl bg-slate-900 px-6 py-3 text-white">Login</a>
</div>
{% endblock %}
