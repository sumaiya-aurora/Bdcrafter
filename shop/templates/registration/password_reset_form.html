{% extends 'shop/base.html' %}
{% block title %}Password Reset - {{ STORE_NAME|default:'Bdcrafter.com' }}{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto rounded-3xl bg-white p-10 shadow-sm">
    <h1 class="text-3xl font-semibold">Reset your password</h1>
    <p class="mt-2 text-slate-500">Enter your email and we’ll send you a link to reset your password.</p>
    <form method="post" class="mt-8 space-y-6">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-slate-700">Email</label>
            <input type="email" name="email" required class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3" />
        </div>
        <button type="submit" class="rounded-2xl bg-slate-900 px-6 py-3 text-white">Send reset link</button>
    </form>
</div>
{% endblock %}
