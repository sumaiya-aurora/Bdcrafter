{% extends 'shop/base.html' %}
{% block title %}Set New Password - {{ STORE_NAME|default:'Bdcrafter.com' }}{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto rounded-3xl bg-white p-10 shadow-sm">
    <h1 class="text-3xl font-semibold">Set a new password</h1>
    <form method="post" class="mt-8 space-y-6">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="rounded-2xl bg-slate-900 px-6 py-3 text-white">Save password</button>
    </form>
</div>
{% endblock %}
